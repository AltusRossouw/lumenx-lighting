# LumenX Lighting — staging stack for Portainer / Proxmox.
#
# This stack is intentionally separate from production: unique container names,
# host port, database name, cookie name, and volume. Nginx Proxy Manager can
# reverse-proxy the staging hostname to host:4001.

services:
  db:
    image: postgres:16-alpine
    container_name: lumenx-staging-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumenx_staging
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lumenx_staging
    volumes:
      - lumenx_staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumenx_staging -d lumenx_staging"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: lumenx-staging-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4000"
      PUBLIC_URL: ${PUBLIC_URL:-https://staging.lumenx.co.za}
      DATABASE_URL: postgres://lumenx_staging:${POSTGRES_PASSWORD}@db:5432/lumenx_staging
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      COOKIE_NAME: lumenx_staging_session
      COOKIE_SECURE: "true"
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: "LumenX Lighting Staging <leads@lumenx.co.za>"
      LEAD_NOTIFY_EMAIL: ${LEAD_NOTIFY_EMAIL:-info@lumenx.co.za}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://staging.lumenx.co.za}
    ports:
      - "4001:4000" # NPM (separate container) can proxy staging to host:4001
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://127.0.0.1:4000/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  updater:
    image: docker:28-git
    container_name: lumenx-staging-updater
    restart: unless-stopped
    environment:
      REPO_URL: https://github.com/AltusRossouw/lumenx-lighting.git
      REPO_REF: staging
      UPDATE_INTERVAL_SECONDS: "300"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - lumenx_staging_updater:/work
    working_dir: /work
    command:
      - sh
      - -c
      - |
        set -eu
        while true; do
          latest="$$(git ls-remote "$${REPO_URL}" "refs/heads/$${REPO_REF}" | awk '{print $$1}')"
          current="$$(cat .last-deployed 2>/dev/null || true)"
          if [ -n "$${latest}" ] && [ "$${latest}" != "$${current}" ]; then
            if [ ! -d repo/.git ]; then
              rm -rf repo
              git clone --branch "$${REPO_REF}" --single-branch "$${REPO_URL}" repo
            else
              git -C repo fetch origin "$${REPO_REF}"
              git -C repo reset --hard "origin/$${REPO_REF}"
            fi
            docker compose -p lumenx-staging -f repo/docker-compose.staging.yml up -d --build --remove-orphans
            printf '%s\n' "$${latest}" > .last-deployed
          fi
          sleep "$${UPDATE_INTERVAL_SECONDS}"
        done

volumes:
  lumenx_staging_pgdata:
  lumenx_staging_updater: