# LumenX Lighting — docker-compose stack for Portainer / Proxmox.
#
# Nginx Proxy Manager (separate container) reverse-proxies HTTPS to the `app`
# service on port 4000. The app serves its own API and the built SPA on that
# single port.
#
# Secrets are injected via ${VAR} interpolation from the stack's environment
# variables (set in Portainer): POSTGRES_PASSWORD, JWT_SECRET, ADMIN_API_KEY,
# RESEND_API_KEY.

services:
  db:
    image: postgres:16-alpine
    container_name: lumenx-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumenx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lumenx
    volumes:
      - lumenx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumenx -d lumenx"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: lumenx-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4000"
      PUBLIC_URL: https://www.lumenx.co.za
      DATABASE_URL: postgres://lumenx:${POSTGRES_PASSWORD}@db:5432/lumenx
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      COOKIE_SECURE: "true"
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: "LumenX Lighting <leads@lumenx.co.za>"
      LEAD_NOTIFY_EMAIL: kaylen@lumenx.co.za
      CORS_ORIGINS: https://www.lumenx.co.za
    ports:
      - "4000:4000" # NPM (separate container) proxies to host:4000
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://127.0.0.1:4000/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  lumenx_pgdata:
